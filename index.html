function colorFor(score, invert){
  if(score===undefined || score===null) return "#3a3f4b";
  // Same thresholds on the raw 1-5 score either way, but the color order is
  // reversed for "gap/need/priority" metrics: high score -> red (bigger gap),
  // low score -> green (smaller gap). For "strength" metrics, high -> green.
  const colors = invert
    ? ["#1a9850","#91cf60","#fee08b","#fc8d59","#d73027"]   // low->green ... high->red
    : ["#d73027","#fc8d59","#fee08b","#91cf60","#1a9850"];  // low->red ... high->green
  if(score < 2.5) return colors[0];
  if(score < 3.0) return colors[1];
  if(score < 3.5) return colors[2];
  if(score < 4.0) return colors[3];
  return colors[4];
}

function metricValue(d, m){
  if(!d) return null;
  const v = m.val100(d);
  return (v===null || v===undefined || isNaN(v)) ? null : v;
}

function metricDescription(m){
  const regional = countryData._regional;
  const group = m.id.startsWith('rating:') ? regional.ratings :
                m.id.startsWith('need:') ? regional.needs : regional.trainings;
  const key = m.id.split(':')[1];
  const avg = group[key];

  const kind = m.id.split(':')[0];
  const whatIsThis = kind === 'rating'
    ? `Each organisation rated its own <i>${m.label}</i> on a scale of 1 (weakest) to 5 (strongest). The map shows each country's <b>average self-rated score</b> &mdash; green = stronger, red = weaker.`
    : kind === 'need'
    ? `Each organisation rated how much it needs <i>${m.label}</i>, beyond additional funding, on a scale of 1 (lowest need) to 5 (highest need). The map shows each country's <b>average score</b> &mdash; red = bigger gap/higher need, green = less of a concern.`
    : `Each organisation ranked how useful training in <i>${m.label}</i> would be, on a scale of 1 (least useful) to 5 (most useful). The map shows each country's <b>average ranking</b> &mdash; red = higher training priority, green = lower priority.`;

  // per-country breakdown, sorted high to low
  const plural = kind === 'rating' ? 'ratings' : kind === 'need' ? 'needs' : 'trainings';
  const countries = ['Iraq','Jordan','Libya','Syria','Turkey'];
  const rows = countries.map(c=>{
    const v = countryData[c][plural][key];
    return [c, v];
  }).filter(([c,v])=>v!=null).sort((a,b)=>b[1]-a[1]);
  const rowsHtml = rows.map(([c,v])=>`<span style="display:inline-block;min-width:64px;">${c}: <b>${v.toFixed(2)}</b></span>`).join(' &nbsp; ');

  const meaning = metricMeaning[m.id] || '';

  const note = metricNotes[m.id] || '';

  return `<div class="descBlock b1">${whatIsThis}</div>` +
         `<div class="descBlock b2">${meaning}</div>` +
         `<div class="descBlock b3">Regional average (115 orgs): <b>${avg}/5</b> &mdash; by country (highest to lowest): ${rowsHtml}${note ? '<br>'+note : ''}</div>`;
}

function styleFor(name){
  const d = countryData[name];
  const v = metricValue(d, currentMetric);
  const invert = !currentMetric.id.startsWith('rating:');
  return { fillColor: colorFor(v, invert), weight: 1.5, color:"#1a1f29", fillOpacity: v===null ? 0.25 : 0.78 };
}

const targetCountries = ["Turkey", "Iraq", "Syria", "Jordan", "Libya"];
let geoLayer;

fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json')
  .then(res => res.json())
  .then(data => {
    geoLayer = L.geoJSON(data, {
      filter: f => targetCountries.includes(f.properties.name),
      style: f => styleFor(f.properties.name),
      onEachFeature: (f, layer) => {
        layer.on('click', (e)=> { L.DomEvent.stopPropagation(e); showCountry(f.properties.name); });
        layer.on('mouseover', ()=> layer.setStyle({fillOpacity:0.97, weight:2.2}));
        layer.on('mouseout', ()=> layer.setStyle(styleFor(f.properties.name)));
        // Ülke ismini merkez noktasına marker olarak ekler
    const center = layer.getBounds().getCenter();
    L.marker(center, {
      interactive: false,
      icon: L.divIcon({
        className: 'country-label',
        html: f.properties.name, // Ülke adını buraya yazar
        iconSize: [120, 20]
      })
    }).addTo(map);
      }
    }).addTo(map);
    map.fitBounds(geoLayer.getBounds(), {paddingTopLeft:[20,140], paddingBottomRight:[20,20]});
    refreshMapColors();
  });

// Clicking empty map area (outside any country polygon) shows the regional overview
map.on('click', ()=> showCountry('_regional'));

function refreshMapColors(){
  if(!geoLayer) return;
  geoLayer.eachLayer(layer=>{
    const name = layer.feature.properties.name;
    layer.setStyle(styleFor(name));
    const d = countryData[name];
    const v = metricValue(d, currentMetric);
    const valTxt = (d && v!==null) ? currentMetric.rawLabel(d) : 'No data';
    layer.unbindTooltip();
    layer.bindTooltip(name + " — " + currentMetric.label + ": " + valTxt);
  });
  legendTitleEl.textContent = currentMetric.label;
  updateLegendBands();
  document.getElementById('metricDesc').innerHTML = metricDescription(currentMetric);
}

const metricBtn = document.getElementById('metricSelectBtn');
const metricDropdown = document.getElementById('metricDropdown');

let lastGroup = null;
metrics.forEach(m=>{
  if(m.group !== lastGroup){
    const g = document.createElement('div');
    g.className = 'grp';
    g.textContent = m.group;
    metricDropdown.appendChild(g);
    lastGroup = m.group;
  }
  const opt = document.createElement('div');
  opt.className = 'opt';
  opt.textContent = m.label;
  opt.dataset.id = m.id;
  opt.addEventListener('click', ()=>{
    currentMetric = m;
    metricBtn.textContent = m.label;
    metricDropdown.classList.remove('open');
    metricDropdown.querySelectorAll('.opt').forEach(o=>o.classList.toggle('selected', o.dataset.id===m.id));
    refreshMapColors();
  });
  metricDropdown.appendChild(opt);
});

metricBtn.addEventListener('click', (e)=>{

});
document.addEventListener('click', (e)=>{

const charts = [];
function destroyCharts(){ charts.forEach(c=>c.destroy()); charts.length = 0; }

const palette = ['#63b3ed','#f6ad55','#68d391','#f687b3','#b794f4','#fc8181','#4fd1c5','#f6e05e','#a0aec0','#ed8936','#9f7aea'];

function makeRadar(canvasId, labels, values, label){
  const c = new Chart(document.getElementById(canvasId), {
    type:'radar',
    data:{ labels, datasets:[{ label, data: values,
      backgroundColor:'rgba(99,179,237,0.25)', borderColor:'#63b3ed', pointBackgroundColor:'#63b3ed', pointRadius:2}]},
    options:{ scales:{ r:{ min:0,max:5, ticks:{color:'#888',backdropColor:'transparent', stepSize:1}, grid:{color:'#333'}, angleLines:{color:'#333'}, pointLabels:{color:'#ccc', font:{size:8.5}}}},
      plugins:{ legend:{display:false},
        tooltip:{callbacks:{label:(ctx)=> ctx.label+': '+ctx.formattedValue+' / 5'}}},
      maintainAspectRatio:false, responsive:false }
  });
  charts.push(c);
}

function makeHBar(canvasId, labels, values, color, max, isCount){
  const c = new Chart(document.getElementById(canvasId), {
    type:'bar',
    data:{ labels, datasets:[{ data: values, backgroundColor: color, borderRadius:3}]},
    options:{ indexAxis:'y',
      scales:{ x:{min:0,max:max||5, ticks:{color:'#888', precision: isCount?0:1}, grid:{color:'#222'}},
               y:{ticks:{color:'#ccc', font:{size:9}}, grid:{display:false}}},
      plugins:{ legend:{display:false},
        tooltip:{callbacks:{label:(ctx)=> isCount ? ctx.parsed.x+' org(s)' : ctx.parsed.x+' / 5'}}},
      maintainAspectRatio:false, responsive:false }
  });
  charts.push(c);
}

function makeVBar(canvasId, labels, values, color){
  const c = new Chart(document.getElementById(canvasId), {
    type:'bar',
    data:{ labels, datasets:[{ data: values, backgroundColor: color}]},
    options:{
      scales:{ y:{beginAtZero:true, ticks:{color:'#888'}, grid:{color:'#222'}},
               x:{ticks:{color:'#ccc', font:{size:9}}, grid:{display:false}}},
      plugins:{ legend:{display:false}}, maintainAspectRatio:false, responsive:false }
  });
  charts.push(c);
}

function makeDonut(canvasId, labels, values){
  const total = values.reduce((a,b)=>a+b,0);
  const c = new Chart(document.getElementById(canvasId), {
    type:'doughnut',
    data:{ labels, datasets:[{ data: values, backgroundColor: palette, borderColor:'#1b212c', borderWidth:2 }]},
    options:{
      cutout:'62%',
      plugins:{ legend:{position:'right', labels:{color:'#ccc', font:{size:9}, boxWidth:12}},
        tooltip:{callbacks:{label:(ctx)=>{
          const pct = total ? Math.round(ctx.parsed/total*100) : 0;
          return ctx.label+': '+ctx.parsed+' ('+pct+'%)';
        }}}},
      maintainAspectRatio:false, responsive:false }
  });
  charts.push(c);
}

// ---- Dynamic, data-driven captions for each chart ----
function pct(part, total){ return total ? Math.round(part/total*100) : 0; }
function topEntries(obj, n){ return Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,n); }
function fmtList(arr){ return arr.map(e=>e[0]).join(', '); }

function setCaptions(d, name, isRegional){
  const scope = isRegional ? 'Across the region' : `In ${name}`;
  const totalOrgs = d.n_orgs;

  // Ratings: highest / lowest
  const ratingEntries = Object.entries(d.ratings).filter(([k,v])=>v!=null);
  const ratingSorted = [...ratingEntries].sort((a,b)=>b[1]-a[1]);
  const rTop = ratingSorted[0], rBot = ratingSorted[ratingSorted.length-1];
  document.getElementById('cap-radar').innerHTML =
    `Self-rated 1&ndash;5 across 12 areas. ${scope}, <b>${rTop[0]}</b> (${rTop[1]}/5) is strongest and <b>${rBot[0]}</b> (${rBot[1]}/5) weakest.`;

  // Needs: highest
  const needEntries = Object.entries(d.needs).filter(([k,v])=>v!=null);
  const needSorted = [...needEntries].sort((a,b)=>b[1]-a[1]);
  const nTop = needSorted[0];
  document.getElementById('cap-needs').innerHTML =
    `Beyond funding, ${scope.toLowerCase()} the highest-rated need is <b>${nTop[0]}</b> (${nTop[1]}/5).`;

  // Trainings: highest / lowest
  const trainEntries = Object.entries(d.trainings).filter(([k,v])=>v!=null);
  const trainSorted = [...trainEntries].sort((a,b)=>b[1]-a[1]);
  const tTop = trainSorted[0], tBot = trainSorted[trainSorted.length-1];
  document.getElementById('cap-training').innerHTML =
    `${scope}, <b>${tTop[0]}</b> (${tTop[1]}/5) ranks as the top training priority and <b>${tBot[0]}</b> (${tBot[1]}/5) the lowest.`;

  // Org types
  const otTop = topEntries(d.org_types, 2);
  const otSum = Object.values(d.org_types).reduce((a,b)=>a+b,0);
  document.getElementById('cap-orgtypes').innerHTML =
    `${scope}, <b>${fmtList(otTop)}</b> make up ${pct(otTop[0][1]+otTop[1][1], otSum)}% of the ${totalOrgs} responding organisations.`;

  // Gender
  document.getElementById('cap-gender').innerHTML =
    `Average overall staff split: <b>${d.gender_dist.Men}% men / ${d.gender_dist.Women}% women</b>${isRegional ? ' &mdash; leadership roles skew further toward men (avg. ~59%).' : '.'}`;

  // Registration
  const regYes = (d.registered && d.registered.Yes) || 0;
  const regSum = Object.values(d.registered||{}).reduce((a,b)=>a+b,0);
  document.getElementById('cap-registered').innerHTML =
    `${pct(regYes, regSum)}% of responding organisations are officially registered.`;

  // Timeline
  const tlTop = topEntries(d.timeline||{}, 1);
  document.getElementById('cap-timeline').innerHTML = tlTop.length
    ? `Most organisations have been active for <b>${tlTop[0][0]}</b> (${tlTop[0][1]} of ${totalOrgs}).`
    : '';

  // Scope
  const scopeTop = topEntries(d.scope, 3);
  document.getElementById('cap-scope').innerHTML =
    `${scope}, the most common focus areas are <b>${fmtList(scopeTop)}</b> (by number of mentions).`;

  // Capacity
  const capTop = topEntries(d.capacity, 2);
  document.getElementById('cap-capacity').innerHTML =
    `${scope}, <b>${fmtList(capTop)}</b> are the most widely reported intervention capacities.`;

  // Funding
  const fundTop = topEntries(d.funding, 2);
  const fundSum = totalOrgs; // mentions can exceed orgs, use orgs as denom for rough %
  document.getElementById('cap-funding').innerHTML =
    `${scope}, the leading funding sources are <b>${fmtList(fundTop)}</b>.`;

  // Budget
  const budgetTop = topEntries(d.budget_dist, 1);
  document.getElementById('cap-budget').innerHTML = budgetTop.length
    ? `The most common annual operating budget band is <b>${budgetTop[0][0]}</b> (${budgetTop[0][1]} organisations).`
    : 'No budget data reported.';

  // Education
  const eduTotal = Object.values(d.education).reduce((a,b)=>a+b,0);
  const eduAdv = (d.education['MA']||0) + (d.education['PhD']||0);
  document.getElementById('cap-education').innerHTML =
    `${eduTotal.toLocaleString()} staff in total; <b>${pct(eduAdv, eduTotal)}%</b> hold a master's or PhD.`;

  // Affiliations
  const affParts = Object.entries(d.affiliations).map(([k,v])=>{
    const tot = v.Yes+v.No;
    return `${k.toLowerCase()}: ${pct(v.Yes,tot)}%`;
  });
  document.getElementById('cap-affiliations').innerHTML =
    `Share of organisations answering "Yes" &mdash; ${affParts.join('; ')}.`;
}
